<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Private network access</title>
  <desc id="d">A workload in an allowed project connects over TCP to the private network gateway of its organization and environment. The gateway opens an outbound Tailscale tunnel to a subnet router in your network, which forwards the traffic to the private endpoint. Workloads in projects that aren't allowed, and in other organizations, can't reach the gateway.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#15803d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="300" rx="12" fill="#f8fafc"/>

  <!-- WSO2 Cloud -->
  <rect x="20" y="20" width="430" height="260" rx="10" fill="#ffffff" stroke="#ff7300" stroke-width="1.5"/>
  <text x="36" y="44" font-size="14" font-weight="600" fill="#0f172a">WSO2 Cloud</text>
  <text x="36" y="62" font-size="12" fill="#475569">Your organization, one environment</text>

  <rect x="40" y="84" width="170" height="64" rx="8" fill="#f0fdf4" stroke="#15803d"/>
  <text x="125" y="111" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Workload</text>
  <text x="125" y="130" font-size="12" fill="#475569" text-anchor="middle">in an allowed project</text>

  <rect x="40" y="190" width="170" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="125" y="217" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">Workload</text>
  <text x="125" y="236" font-size="12" fill="#64748b" text-anchor="middle">in another project</text>

  <rect x="270" y="120" width="160" height="70" rx="8" fill="#fff7ed" stroke="#ff7300"/>
  <text x="350" y="149" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Private network</text>
  <text x="350" y="168" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">gateway</text>

  <path d="M210 116 L268 146" stroke="#15803d" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <text x="222" y="112" font-size="11" fill="#15803d">TCP</text>
  <path d="M210 222 L262 186" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
  <text x="228" y="230" font-size="16" font-weight="700" fill="#dc2626">&#x2715;</text>

  <!-- Tunnel -->
  <path d="M430 155 L588 155" stroke="#15803d" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <text x="520" y="140" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Outbound tunnel</text>
  <text x="520" y="176" font-size="11" fill="#475569" text-anchor="middle">Tailscale, encrypted</text>

  <!-- Your network -->
  <rect x="590" y="20" width="270" height="260" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="606" y="44" font-size="14" font-weight="600" fill="#0f172a">Your network</text>
  <text x="606" y="62" font-size="12" fill="#475569">Your tailnet</text>

  <rect x="606" y="120" width="112" height="70" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="662" y="149" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Subnet</text>
  <text x="662" y="168" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">router</text>

  <rect x="740" y="120" width="104" height="70" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="792" y="149" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Private</text>
  <text x="792" y="168" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">endpoint</text>

  <path d="M718 155 L738 155" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="792" y="214" font-size="11" fill="#475569" text-anchor="middle">For example, a</text>
  <text x="792" y="229" font-size="11" fill="#475569" text-anchor="middle">database on :5432</text>
</svg>
